[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecm-polarimetry"
version = "6.5.5"
description = "Ellipsometric Calibration Method for Mueller Matrix Polarimetry"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.9"
authors = [
    {name = "Daniel Vala"}
]
keywords = [
    "polarimetry",
    "mueller matrix",
    "ellipsometry",
    "calibration",
    "optics",
    "spectroscopy"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.urls]
"Source" = "https://github.com/your-username/ecm-calibration"
"Documentation" = "https://github.com/your-username/ecm-calibration#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecm*"]

[tool.setuptools.package-data]
ecm = ["py.typed"]
